<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#21190f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/motion.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/record-modal.js" defer></script>
  <script src="/js/global-search.js" defer></script>
  <script src="/js/register.js" defer></script>
  <title>Criar conta — Tenebra</title>
</head>
<body class="login-body">
  <div class="paper-grain" aria-hidden="true"></div>
  <main class="login-wrap"><section class="login-card" aria-labelledby="registerTitle">
    <div class="login-seal" aria-hidden="true"><span>✶</span></div>
    <p class="eyebrow">Novo registro · Comunidade Tenebra</p>
    <h1 id="registerTitle">Atravesse o <em>véu</em></h1>
    <p class="login-lead">Crie uma conta para conversar e guardar suas fichas. Contas novas começam como usuários comuns.</p>
    <div class="flash flash-err" id="registerError" role="alert" hidden></div>
    <form class="login-form" id="registerForm">
      <label class="field"><span>Usuário (3–30: letras, números, _ ou -)</span><input id="registerUsername" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_-]+" autocomplete="username"></label>
      <label class="field"><span>Senha (mínimo 12 caracteres)</span><input id="registerPassword" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label>
      <label class="field"><span>Confirme a senha</span><input id="registerConfirm" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label>
      <button class="button button-dark login-submit" id="registerButton" type="submit">Criar conta <span>↗</span></button>
    </form>
    <p class="login-register-link">Já possui conta? <a class="inline-link" href="login.html">Entrar</a></p>
    <a class="text-link back-link" href="index.html">← Voltar ao site</a>
  </section></main>
</body>
</html>
