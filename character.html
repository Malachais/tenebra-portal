<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#21190f">
  <meta name="description" content="Ficha pública de um personagem do universo de Tenebra.">
  <title>Personagem — Arquivo de Tenebra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/motion.css">
  <script src="js/api.js" defer></script>
  <script src="js/character-page.js" defer></script>
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <header class="site-header">
    <a class="seal" href="/"><span class="seal-mark">✶</span><span class="seal-name">TENEBRA</span></a>
    <nav class="main-nav" aria-label="Navegação principal"><a href="/personagens">Personagens</a><a href="/#grimorio">Grimório</a><a href="/#bestiario">Bestiário</a><a class="nav-stamp" href="/login.html">Acesso restrito</a></nav>
  </header>
  <main class="article-page page-shell">
    <a class="text-link" href="/personagens">← Voltar aos personagens</a>
    <article class="article-entry character-entry" aria-labelledby="characterTitle">
      <p class="eyebrow" id="characterMeta">Personagem do universo · consultando o arquivo</p>
      <h1 id="characterTitle">A ficha aguarda consulta</h1>
      <p class="article-summary" id="characterSummary"></p>
      <div id="characterMedia"></div>
      <dl class="character-stats character-stats-public" id="characterStats" hidden></dl>
      <section class="character-detail-block" id="characterBackstoryBlock"><h2>História</h2><div class="article-content" id="characterBackstory" aria-live="polite">Abrindo a ficha…</div></section>
      <section class="character-detail-block" id="characterInventoryBlock" hidden><h2>Inventário</h2><div class="article-content" id="characterInventory"></div></section>
      <section class="character-detail-block" id="characterSkillsBlock" hidden><h2>Habilidades</h2><div class="article-content" id="characterSkills"></div></section>
      <p class="character-owner-actions" id="characterOwnerActions" hidden></p>
      <section id="characterRelated" hidden></section>
      <p class="dialog-foot" id="characterFoot">SFA · ELENCO DE TENEBRA</p>
    </article>
    <p class="empty-state" id="characterError" role="alert" hidden></p>
  </main>
  <footer class="site-footer"><div class="page-shell footer-inner"><a class="footer-brand" href="/">TENEBRA <span>✶</span></a><p>Segredo Floresta Adentro · Personagens</p><a href="/personagens">Elenco público ↑</a></div></footer>
</body>
</html>
